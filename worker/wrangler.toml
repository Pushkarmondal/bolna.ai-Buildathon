name = "bhaav"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The built web app. Routes the Worker owns run first; everything else is the single-page app.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*", "/tools/*", "/webhooks/*"]

[[d1_databases]]
binding = "DB"
database_name = "bhaav"
# Replace with the id printed by `npx wrangler d1 create bhaav` before the first remote deploy.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Every minute: catch up on calls whose webhook never arrived.
[triggers]
crons = ["* * * * *"]

[vars]
# Tried in order; the next one is used when Groq answers 429 or 5xx.
GROQ_MODELS = "openai/gpt-oss-20b,openai/gpt-oss-120b,qwen/qwen3.8-27b"
GROQ_BASE_URL = "https://api.groq.com/openai/v1"
BOLNA_BASE_URL = "https://api.bolna.ai"
# Printed by `npm run agents:setup`; paste them here.
BOLNA_DESK_AGENT_ID = ""
BOLNA_CALLER_AGENT_ID = ""
# The Caller again, cut off at 2 minutes, for judges' practice calls. Empty uses the Caller.
BOLNA_PRACTICE_AGENT_ID = ""
# The owner line: calls the owner with the result, to approve by voice. Empty turns it off.
BOLNA_OWNER_AGENT_ID = ""
# "on" once the Caller has Bolna's transfer tool (agents:setup with OWNER_PHONE): a supplier who
# insists on the owner is connected to them mid-call.
BOLNA_HANDOFF = ""
# Optional: a number bought in Bolna. Empty uses Bolna's default number.
BOLNA_FROM_NUMBER = ""
# Comma-separated E.164 numbers Bhaav may call (e.g. "+919800000001,+919800000002").
# Empty allows none, so nobody with the passcode can make Bhaav call a stranger. "*" allows any
# number: only for local runs against the fake Bolna.
SUPPLIER_ALLOWLIST = ""
# A ceiling on phone calls in any 24 hours, to protect the credit.
MAX_CALLS_PER_DAY = "60"
# Phone calls live at once across every order. Bolna's trial allows 2, and a browser call may
# hold one of them.
MAX_LIVE_CALLS = "1"
# Hours in India time when suppliers may be called ("10-19" is 10:00 to 19:00). Calls wait
# outside them.
CALL_HOURS = "10-19"
# Where Bolna's webhooks come from (Bolna's docs). Others are refused; "*" accepts any.
BOLNA_WEBHOOK_IPS = "13.203.39.153,13.126.9.249,13.202.133.53"

[observability]
enabled = true
